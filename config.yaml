# LightHermes 配置文件

secrets:
  env_file: .env.local

# 模型配置（model / key / url 都在 .env.local，见 .env.example）
model:
  provider: openai
  model_name: ${LIGHTHERMES_MODEL}
  api_key: ${LIGHTHERMES_API_KEY}
  base_url: ${LIGHTHERMES_BASE_URL}
  fallback_models: []

embedding:
  provider: openai
  model_name: ${LIGHTHERMES_EMBEDDING_MODEL}
  api_key: ${LIGHTHERMES_EMBEDDING_API_KEY}
  base_url: ${LIGHTHERMES_EMBEDDING_BASE_URL}

# 记忆配置
memory:
  enabled: true
  storage_dir: memory
  active_recall:
    enabled: false
    max_rounds: 2
    persist_traces: true
    trace_dir: memory/recall_traces

  # 混合检索配置 (可选 - 提升记忆检索精度)
  # 默认使用简单关键词匹配,无需额外依赖
  # 启用混合检索需要: pip install sentence-transformers (本地) 或使用 OpenAI API
  hybrid_retrieval:
    enabled: true                # 是否启用混合检索 (默认 false)
    strict_hybrid_retrieval: false  # true 时 embedding/hybrid 失败即抛错而非回退关键词
    min_candidates: 5            # TF-IDF 候选少于该值时触发 embedding fallback
    fallback_to_all: true        # 候选不足时回退到全量语义记忆 embedding rerank
    semantic_threshold: 0.50     # BGE-M3 评测起点；其他模型需按相似度分布调参
    score_margin: 0.08           # BGE-M3 保留接近 top 的结果，抑制语义尾部噪声
    full_rerank_max_docs: 200    # 全量 rerank 的最大语义记忆条数
    tfidf_candidate_limit: 20    # TF-IDF 初筛候选上限

  retention:
    short_term_turns: 50
    working_memory_days: 7
    semantic_max_entries: 1000
    semantic_max_chars: 200000
    semantic_similarity_threshold: 0.85
    distill_recent_limit: 20

  # 召回截断参数（默认值保持与历史行为一致，长文档记忆可放开）
  recall:
    seed_limit: 8
    seed_max_chars: 2000
    item_max_chars: 500      # 0 表示不截断
    search_max_chars: 10000

# R0 暂停旧自动进化；R3 将接入可验证的经验闭环
# 不再支持 auto_generate_skills: true
evolution:
  enabled: false

# 技能配置
skills:
  dirs:
    - skills/core
    - skills/user
  disabled: []

# 工具配置
# 内置文件工具默认关闭；开启后仍受 roots、敏感文件和大小限制保护
# file_write 必须单独显式开启，不会被 file_read/file_search 隐式启用
tools:
  builtin:
    enabled: true
    memory_search: true
    memory_read: true
    file_read: false
    file_search: false
    file_write: false
    roots:
      - .
    max_read_chars: 20000
    max_write_chars: 20000
    max_search_results: 20

# 上下文压缩配置
context_compression:
  enabled: true

  # 触发阈值（当 token 使用达到上下文窗口的 75% 时触发压缩）
  trigger_threshold: 0.75

  # 摘要模型与主模型同一套 env，避免旧端点写死
  summary_model: ${LIGHTHERMES_MODEL}

  # 保护策略
  protect_first_n: 3  # 保护前 N 条消息（系统提示 + 初始对话）
  protect_recent_tokens: 20000  # 保护最近 N tokens 的对话

  # 摘要预算
  summary_min_tokens: 2000
  summary_max_tokens: 12000
  summary_ratio: 0.20  # 压缩内容的 20%

  # 可选：压缩时提取关键信息到记忆系统
  extract_to_memory: false

# CLI 配置
cli:
  prompt_symbol: ">"
  show_banner: true
  stream_output: true # MiniMax Anthropic 兼容流式已通过 smoke test
  show_skill_usage: true
  color_enabled: true

# 日志配置
logging:
  level: INFO
  file: logs/lighthermes.log
  debug: false
